<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="author" content="Jacob Gregorio">
    <meta name="description" content="intrument finder page">
    <title>Intrument Finder</title>
    <link rel="icon" type="image/svg+xml" href="img/noun_instrument_3327416.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img class="header-image" src="img/noun_instrument_3327416.svg" alt="Logo">
        <h1 id="pageTitle">Instrument Index</h1>
        <h2 id="pageSubheading">What type of instrument would you like to play?</h2>
        <section>
            <a href="index.html">Home</a>
            <a href="instrument-finder.html">Explore Instruments</a>
            <a href="buying-instrument-guide.html">Instrument Buying Guide</a>
            <a href="contact.html">Contact Us!</a>
        </section>
    </header>
    
    <p id="loadingMessage" role="status">
        Loading instrument information...
    </p>

    <main class="instrument-grid" id="instrumentChoices">
        <button type="button" class="instrument-option" data-family="brass">
            <section>
                <img class="img-standard" src="img/chris-bair-A10y2Eq7OHY-unsplash.jpg" alt="Brass image">
                <h2 class="text-link-format">Brass</h2>
            </section>
        </button>

        <button type="button" class="instrument-option" data-family="woodwinds">
        <section>
            <img class="img-standard" src="img/jacob-mcgowin-HkHoF32l81E-unsplash.jpg" alt="Woodwind image">
            <h2 class="text-link-format">Woodwinds</h2>
        </section>
        </button>

        <button type="button" class="instrument-option" data-family="percussion">
        <section>
            <img class="img-standard" src="img/matthijs-smit-bRG2C0FAQEY-unsplash.jpg" alt="Percussion image">
            <h2 class="text-link-format">Percussion</h2>
        </section>
        </button>

        <button type="button" class="instrument-option" data-family="strings">
        <section>
            <img class="img-standard" src="img/larisa-birta-slbOcNlWNHA-unsplash.jpg" alt="Strings image">
            <h2 class="text-link-format">Strings</h2>
        </section>
        </button>
    </main>

    <button type="button" id="backButton" class="back-button" hidden>
        Back
    </button>

    <footer>
        <a href="contact.html#credits">Credits</a>
    </footer>

    <script src="js/instruments.js"></script>
</body>
</html>
